<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Pharmacy – GramHealth</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .search-section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .search-box input {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    .pharmacy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .pharmacy-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .pharmacy-card:hover {
      box-shadow: 0 4px 12px rgba(22,163,74,0.1);
      border-color: var(--primary);
    }
    .pharmacy-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .pharmacy-address {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pharmacy-distance {
      font-size: 0.9rem;
      color: var(--gray-700);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pharmacy-hours {
      font-size: 0.85rem;
      color: var(--gray-600);
      margin-bottom: 8px;
      padding: 4px 0;
    }
    .pharmacy-phone {
      font-size: 0.9rem;
      color: var(--gray-800);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <!-- Navigation (matches patient dashboard style) -->
  <nav class="nav">
    <div class="nav-brand">🏥 Gram<span class="dot">Health</span></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="user-name" style="font-size:0.82rem;color:var(--text-muted);"></span>
      <button onclick="Auth.logout()" style="background:none;border:none;cursor:pointer;font-size:0.82rem;color:var(--text-muted);">Logout</button>
    </div>
  </nav>

  <div class="content" style="max-width:1200px;margin:0 auto;padding:20px;">
    <a href="/patient-dashboard.html" class="back-link">← Back to Dashboard</a>
    <h1 style="font-family:'Fraunces',serif; margin-bottom: 5px;">💊 Find Nearby Pharmacy</h1>
    <p style="color:var(--text-muted); margin-bottom: 30px;">Search for pharmacies and check medicine availability</p>

    <!-- Search Section -->
    <div class="search-section">
      <h3>🔍 Search by location</h3>
      <div class="search-box">
        <input type="text" id="location-input" placeholder="Enter village, town, or city (e.g., Nabha, Punjab)" value="Nabha, Punjab">
        <button class="btn btn-primary" onclick="searchPharmacies()">Search</button>
        <button class="btn btn-outline" onclick="useMyLocation()">📍 Use my location</button>
      </div>
      <div id="search-status"></div>
    </div>

    <!-- Results Container -->
    <div id="results-container"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // Simple cache to avoid repeated API calls
    const searchCache = {};

    const locationInput = document.getElementById('location-input');
    const searchStatus = document.getElementById('search-status');
    const resultsContainer = document.getElementById('results-container');

    // Display logged-in user's name
    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.user;
      if (user) {
        document.getElementById('user-name').textContent = user.name;
      }
      locationInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') searchPharmacies();
      });
    });

    function setLoading(isLoading, message = 'Searching for pharmacies...') {
      if (isLoading) {
        searchStatus.innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <p>${message}</p>
          </div>
        `;
        resultsContainer.innerHTML = '';
      } else {
        searchStatus.innerHTML = '';
      }
    }

    function showError(message) {
      searchStatus.innerHTML = `<div class="error-message">❌ ${escapeHtml(message)}</div>`;
    }

    async function searchPharmacies(locationOverride) {
      const location = locationOverride || locationInput.value.trim();
      if (!location) {
        showError('Please enter a location.');
        return;
      }

      setLoading(true, `Searching pharmacies near "${location}"...`);

      try {
        const result = await fetchNearbyPharmacies(location);
        displayPharmacies(
          result.pharmacies,
          result.location?.displayName || location,
          result
        );
      } catch (error) {
        console.warn('Live pharmacy search unavailable:', error.message);
        try {
          const pharmacies = await fetchLocalPharmacies();
          displayPharmacies(pharmacies, location, {
            source: 'local',
            warning: 'Live map search is unavailable. Showing GramHealth directory entries instead.'
          });
        } catch {
          showError(error.message || 'Failed to search pharmacies. Please try again.');
        }
      } finally {
        setLoading(false);
      }
    }

    function useMyLocation() {
      if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser.');
        return;
      }

      setLoading(true, 'Getting your location...');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          const locationString = `${latitude},${longitude}`;
          await searchPharmacies(locationString);
        },
        (error) => {
          setLoading(false);
          let msg = 'Unable to get your location. ';
          switch (error.code) {
            case error.PERMISSION_DENIED:
              msg += 'Please allow location access or enter manually.';
              break;
            case error.POSITION_UNAVAILABLE:
              msg += 'Location information unavailable.';
              break;
            case error.TIMEOUT:
              msg += 'Location request timed out.';
              break;
            default:
              msg += 'Unknown error.';
          }
          showError(msg);
        }
      );
    }

    async function fetchNearbyPharmacies(location) {
      // Return cached result if available
      if (searchCache[location]) {
        console.log('Using cached result for', location);
        return searchCache[location];
      }

      const result = await API.get(`/pharmacy/nearby?location=${encodeURIComponent(location)}`);

      // Store in cache
      searchCache[location] = result;

      return result;
    }

    async function fetchLocalPharmacies() {
      const inventory = await API.get('/pharmacy');
      return inventory.map(pharmacy => ({
        name: pharmacy.pharmacyName,
        address: pharmacy.location,
        distance: null,
        phone: 'Not available',
        hours: 'Hours not specified'
      }));
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function displayPharmacies(pharmacies, location, metadata = {}) {
      const safeLocation = escapeHtml(location);
      if (!pharmacies || pharmacies.length === 0) {
        resultsContainer.innerHTML = `<p class="text-muted" style="text-align:center; padding:40px;">No mapped pharmacies found near "${safeLocation}". Try a larger town or nearby city.</p>`;
        return;
      }

      const sourceNotice = metadata.source === 'openstreetmap'
        ? `<div style="font-size:0.78rem;color:var(--text-muted);margin:-10px 0 16px;">Map data: <a href="${metadata.attributionUrl || 'https://www.openstreetmap.org/copyright'}" target="_blank" rel="noopener">${escapeHtml(metadata.attribution || '© OpenStreetMap contributors')}</a>${metadata.searchRadiusKm ? ` • searched within ${escapeHtml(metadata.searchRadiusKm)} km` : ''}</div>`
        : metadata.warning
          ? `<div style="padding:10px 12px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;color:#92400e;font-size:0.82rem;margin:-8px 0 16px;">⚠️ ${escapeHtml(metadata.warning)}</div>`
          : '';

      const html = `
        <h2 style="margin-bottom:20px;">📌 Pharmacies near ${safeLocation}</h2>
        ${sourceNotice}
        <div class="pharmacy-grid">
          ${pharmacies.map(p => {
            const safeName = escapeHtml(p.name || 'Unnamed Pharmacy');
            const safePhone = escapeHtml(p.phone || '');
            const mapUrl = typeof p.mapUrl === 'string' && p.mapUrl.startsWith('https://www.openstreetmap.org/')
              ? p.mapUrl
              : '';
            return `
            <div class="pharmacy-card">
              <div class="pharmacy-name">${safeName}</div>
              <div class="pharmacy-address">
                <span>📍</span> ${escapeHtml(p.address || 'Address not available')}
              </div>
              ${p.distance ? `<div class="pharmacy-distance"><span>📏</span> ${escapeHtml(p.distance)}</div>` : ''}
              ${p.hours ? `
              <div class="pharmacy-hours">
                <span>🕒</span> ${escapeHtml(p.hours)}
              </div>` : ''}
              ${p.phone && p.phone !== 'Not available' ? `
              <div class="pharmacy-phone">
                <span>📞</span> <a href="tel:${safePhone.replace(/[^+0-9]/g, '')}">${safePhone}</a>
              </div>` : ''}
              ${p.rating ? `
              <div style="font-size:0.9rem; color:#f59e0b;">⭐ ${escapeHtml(p.rating)} / 5</div>` : ''}
              ${mapUrl ? `<a class="btn btn-outline btn-sm" style="margin-top:10px;" href="${mapUrl}" target="_blank" rel="noopener">🗺️ View on map</a>` : ''}
              <button class="btn btn-secondary btn-sm" style="margin-top:10px;" data-pharmacy-name="${safeName}" onclick="checkStock(this.dataset.pharmacyName)">💊 Check Medicine Stock</button>
            </div>
          `}).join('')}
        </div>
      `;

      resultsContainer.innerHTML = html;
    }

    // Mock function for checking medicine stock (for demo purposes)
    function checkStock(pharmacyName) {
      const mockMedicines = [
        { name: 'Paracetamol', stock: Math.random() > 0.3 ? 'In Stock' : 'Low Stock', price: '₹25' },
        { name: 'Amoxicillin', stock: Math.random() > 0.5 ? 'In Stock' : 'Out of Stock', price: '₹120' },
        { name: 'Cetirizine', stock: 'In Stock', price: '₹35' }
      ];
      const stockList = mockMedicines.map(m => `${m.name}: ${m.stock} (${m.price})`).join('<br>');
      Toast.info(`Medicines at ${escapeHtml(pharmacyName)}:<br>${stockList}`);
    }
  </script>
</body>
</html>
